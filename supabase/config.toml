project_id = "saasathon-starter"
[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 55432
shadow_port = 55430
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = false
[studio]
enabled = true
port = 55433
api_url = "http://127.0.0.1"
[local_smtp]
enabled = true
port = 55434
[storage]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1s"
otp_length = 6
otp_expiry = 600
[auth.email.template.magic_link]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic-link.html"
[auth.email.template.confirmation]
subject = "Your sign-in code"
content_path = "./supabase/templates/magic-link.html"
[analytics]
enabled = false
